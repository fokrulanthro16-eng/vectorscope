services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vectorscope-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    image: nginx:alpine
    container_name: vectorscope-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
